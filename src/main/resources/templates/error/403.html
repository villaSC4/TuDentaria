<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Denegado - Tu Dentaria</title>
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    body {
        background-color: #f4f7f6;
        font-family: 'Segoe UI', sans-serif;
        height: 100vh;
    }
    .error-container {
        text-align: center;
        max-width: 500px;
        padding: 2.5rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .error-code {
        font-size: 6rem;
        font-weight: 800;
        color: #dc3545;
        line-height: 1;
    }
    .btn-home {
        background-color: #1f4b61;
        border-color: #1f4b61;
        color: white;
        transition: 0.3s;
    }
    .btn-home:hover {
        background-color: #112936;
        border-color: #112936;
        color: white;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">

<div class="error-container">
  <div class="mb-3 text-danger">
    <i class="fas fa-user-shield fa-4x"></i>
  </div>
  <h1 class="error-code">403</h1>
  <h3 class="fw-bold text-secondary mb-3">Acceso Restringido</h3>
  <p class="text-muted mb-4">
    No tienes los permisos o privilegios necesarios para ver este módulo administrativo. Si crees que se trata de un error, contacta al soporte técnico.
  </p>
  <a th:href="@{/}" class="btn btn-home px-4 py-2 fw-bold text-uppercase rounded-1 shadow-sm">
    <i class="fas fa-arrow-left me-2"></i> Regresar al Portal
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
