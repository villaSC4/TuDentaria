<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Dentaria - Iniciar Sesión</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body style="background-color: #f4f7f6;">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 md-p-5 border-0 bg-white" style="max-width: 440px; width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">

        <div class="text-center mb-4">
            <a th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="TuDentaria" height="75" style="object-fit: contain;">
            </a>
            <h4 class="fw-bold mt-4 mb-1 text-uppercase" style="color: #1f4b61; letter-spacing: 1px;">Iniciar Sesión</h4>
            <p class="text-muted small">Ingresa tus credenciales para acceder a tu cuenta clínica</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger p-2 small text-center rounded-2 border-0" role="alert" style="background-color: #fde8e8; color: #e02424;">
            <i class="fas fa-exclamation-circle me-1"></i> Correo o contraseña incorrectos.
        </div>

        <div th:if="${param.registrado}" class="alert alert-info p-2 small text-center rounded-2 border-0" role="alert" style="background-color: #e1f5fe; color: #0288d1;">
            <i class="fas fa-info-circle me-1"></i> ¡Registro exitoso! Ya puedes iniciar sesión.
        </div>

        <form th:action="@{/login}" method="POST" class="mt-2">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-2 text-muted"><i class="far fa-envelope"></i></span>
                    <input type="email" name="username" class="form-control bg-light border-start-0 rounded-end-2 py-2" placeholder="ejemplo@correo.com" required style="font-size: 0.9rem;">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-2 text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control bg-light border-start-0 py-2" placeholder="••••••••" required style="font-size: 0.9rem;">
                    <button class="input-group-text bg-light border-start-0 rounded-end-2 text-muted" type="button" onclick="togglePassword('password', 'eyeIcon')">
                        <i id="eyeIcon" class="far fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-2.5 fw-bold text-uppercase mb-3 rounded-2 shadow-sm" style="background-color: #1f4b61; border-color: #1f4b61; transition: 0.3s; font-size: 0.9rem; letter-spacing: 0.5px;">
                <i class="fas fa-sign-in-alt me-2"></i> Ingresar
            </button>

            <div class="text-center mt-3 border-top pt-3">
                <span class="small text-muted">¿Aún no tienes cuenta con nosotros? </span>
                <a th:href="@{/registro}" class="small fw-bold text-decoration-none" style="color: #00BCD4;">Regístrate aquí</a>
            </div>
        </form>

    </div>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById(iconId);

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("fa-eye");
            eyeIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("fa-eye-slash");
            eyeIcon.classList.add("fa-eye");
        }
    }
</script>
</body>
</html>
