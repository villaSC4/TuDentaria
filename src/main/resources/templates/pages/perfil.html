<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Dentaria - Mi Perfil</title>
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body style="background-color: #f4f7f6;">

<header>
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
      <a th:href="@{/}" class="navbar-brand">
        <img th:src="@{/img/logo.png}" alt="TuDentaria" height="70">
      </a>
      <a th:href="@{/}" class="btn btn-outline-dark btn-sm fw-bold rounded-1">
        <i class="fas fa-arrow-left me-1"></i> Volver al Inicio
      </a>
    </div>
  </nav>
</header>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div th:if="${exito}" class="alert alert-success border-0 shadow-sm d-flex align-items-center mb-4 p-3 rounded-3" role="alert" style="background-color: #def7ec; color: #03543f;">
        <i class="fas fa-check-circle fa-lg me-2"></i>
        <div th:text="${exito}" class="fw-semibold small"></div>
      </div>

      <div th:if="${error}" class="alert alert-danger border-0 shadow-sm d-flex align-items-center mb-4 p-3 rounded-3" role="alert" style="background-color: #fde8e8; color: #e02424;">
        <i class="fas fa-exclamation-circle fa-lg me-2"></i>
        <div th:text="${error}" class="fw-semibold small"></div>
      </div>

      <div class="card border-0 bg-white shadow-sm p-4 md-p-5" style="border-radius: 16px;">

        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
          <div class="bg-light d-flex align-items-center justify-content-center rounded-circle text-info border border-info border-2" style="width: 70px; height: 70px;">
            <i class="fas fa-user-circle fa-3x"></i>
          </div>
          <div class="ms-3">
            <h4 class="fw-bold m-0" style="color: #1f4b61;" th:text="${usuario.nombre} + ' ' + ${usuario.apellido}">Nombre Usuario</h4>
            <span class="badge bg-light text-secondary border mt-1 px-2.5 py-1 text-uppercase fw-bold tracking-wider" style="font-size: 0.7rem;">Paciente Clínico</span>
          </div>
        </div>

        <h5 class="fw-bold mb-3 text-uppercase small tracking-wide text-secondary"><i class="fas fa-user-edit me-2"></i>Editar Datos Personales</h5>

        <form th:action="@{/perfil/actualizar}" th:object="${usuario}" method="POST">
          <input type="hidden" th:field="*{id}">

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-muted">Nombre</label>
              <input type="text" th:field="*{nombre}" class="form-control bg-light rounded-2 py-2" required style="font-size: 0.9rem;">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold text-muted">Apellido</label>
              <input type="text" th:field="*{apellido}" class="form-control bg-light rounded-2 py-2" required style="font-size: 0.9rem;">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-muted">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="far fa-envelope"></i></span>
              <input type="email" th:field="*{email}" class="form-control bg-light border-start-0 rounded-end-2 py-2" required style="font-size: 0.9rem;">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 border-top pt-4">
            <a th:href="@{/}" class="btn btn-light px-4 py-2 fw-semibold rounded-2" style="font-size: 0.9rem;">Cancelar</a>
            <button type="submit" class="btn text-white px-4 py-2 fw-bold rounded-2 shadow-sm" style="background-color: #00BCD4; border-color: #00BCD4; font-size: 0.9rem;">
              <i class="fas fa-save me-1"></i> Guardar Cambios
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

</body>
</html>
