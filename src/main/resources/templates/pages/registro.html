<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Dentaria - Registro de Pacientes</title>
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body style="background-color: #f4f7f6;">

<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
  <div class="card p-4 md-p-5 border-0 bg-white" style="max-width: 480px; width: 100%; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">

    <div class="text-center mb-4">
      <a th:href="@{/}">
        <img th:src="@{/img/logo.png}" alt="TuDentaria" height="75" style="object-fit: contain;">
      </a>
      <h4 class="fw-bold mt-4 mb-1 text-uppercase" style="color: #1f4b61; letter-spacing: 1px;">Crear Cuenta</h4>
      <p class="text-muted small">Regístrate en nuestra plataforma para gestionar tus citas</p>
    </div>

    <form th:action="@{/registro}" th:object="${usuario}" method="POST" class="mt-2">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary">Nombre</label>
          <input type="text" th:field="*{nombre}" class="form-control bg-light rounded-2 py-2" placeholder="Tu nombre" required style="font-size: 0.9rem;">
        </div>
        <div class="col-md-6">
          <label class="form-label small fw-semibold text-secondary">Apellido</label>
          <input type="text" th:field="*{apellido}" class="form-control bg-light rounded-2 py-2" placeholder="Tu apellido" required style="font-size: 0.9rem;">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Correo Electrónico</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-2 text-muted"><i class="far fa-envelope"></i></span>
          <input type="email" th:field="*{email}" class="form-control bg-light border-start-0 rounded-end-2 py-2" placeholder="tu@correo.com" required style="font-size: 0.9rem;">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-secondary">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-2 text-muted"><i class="fas fa-lock"></i></span>
          <input type="password" id="regPassword" th:field="*{password}" class="form-control bg-light border-start-0 py-2" placeholder="Mínimo 6 caracteres" required style="font-size: 0.9rem;">
          <button class="input-group-text bg-light border-start-0 rounded-end-2 text-muted" type="button" onclick="togglePassword('regPassword', 'regEyeIcon')">
            <i id="regEyeIcon" class="far fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn w-100 py-2.5 fw-bold text-white text-uppercase mb-3 rounded-2 shadow-sm" style="background-color: #00BCD4; border-color: #00BCD4; transition: 0.3s; font-size: 0.9rem; letter-spacing: 0.5px;">
        <i class="fas fa-user-plus me-2"></i> Registrarme
      </button>

      <div class="text-center mt-3 border-top pt-3">
        <span class="small text-muted">¿Ya tienes una cuenta creada? </span>
        <a th:href="@{/login}" class="small fw-bold text-decoration-none" style="color: #1f4b61;">Inicia sesión aquí</a>
      </div>
    </form>

  </div>
</div>

<script>
  function togglePassword(inputId, iconId) {
      const passwordInput = document.getElementById(inputId);
      const eyeIcon = document.getElementById(iconId);

      if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
      } else {
          passwordInput.type = "password";
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
      }
  }
</script>
</body>
</html>
