spring.application.name=tudentaria

# Perfil activo por defecto (usa 'local' con H2 en memoria si no se especifica otro)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Puerto dinámico asignado por Railway / Render / Cloud
server.port=${PORT:8080}

# Configuración inteligente de MySQL (soporta variables nativas de Railway y personalizadas)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:${MYSQL_DATABASE:tudentaria}}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hikari Pool para conexiones estables en la nube
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-test-query=SELECT 1

# Configuración Hibernate / JPA con Dialecto explícito
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true

# Límite de carga de archivos (fotos de doctores)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Administrador inicial: se crea SOLO si defines ambas variables de entorno
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Datos de demostración. Solo true en desarrollo.
app.seed-demo=${SEED_DEMO:true}