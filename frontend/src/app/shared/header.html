<header><nav class="navbar navbar-expand-lg bg-white shadow-sm" aria-label="Navegación principal"><div class="container">
<a routerLink="/" class="navbar-brand"><img src="/img/logo.png" alt="TuDentaria, inicio" height="75"></a>
<button class="navbar-toggler" type="button" (click)="menu=!menu" [attr.aria-expanded]="menu" aria-controls="menu" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" [class.show]="menu" id="menu"><ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
@for(link of links; track link.path) { <li class="nav-item"><a class="nav-link" [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="menu=false">{{link.text}}</a></li> }
@if(auth.autenticado()) {
<li class="nav-item"><a class="nav-link" routerLink="/perfil" (click)="menu=false">Mi perfil</a></li>
<li class="nav-item"><a class="nav-link" routerLink="/mis-citas" (click)="menu=false">Mis citas</a></li>
@if(auth.esAdmin()) { <li class="nav-item"><a class="nav-link" routerLink="/admin" (click)="menu=false">Administración</a></li> }
<li class="nav-item"><button class="btn btn-outline-dark" (click)="auth.salir();menu=false">Salir</button></li>
} @else {
<li class="nav-item"><a class="btn btn-outline-dark" routerLink="/login" (click)="menu=false">Ingresar</a></li>
<li class="nav-item"><a class="btn btn-brand" routerLink="/registro" (click)="menu=false">Registrarse</a></li>
}</ul></div></div></nav></header>
