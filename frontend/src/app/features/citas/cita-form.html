<div class="form-card"><h2 class="h3">Solicita tu cita</h2><p>Las solicitudes se confirman con la clínica. Atención de lunes a sábado.</p>
@if(error()){<div class="alert alert-danger" role="alert">{{error()}}</div>}
@if(catalogoError()){<div class="alert alert-warning" role="alert">No se pudieron cargar las opciones. <button type="button" class="btn btn-sm btn-outline-dark" (click)="cargarCatalogos()">Reintentar</button></div>}
@if(exito()){<div class="alert alert-success" role="status">{{exito()}}</div>}
<form [formGroup]="form" (ngSubmit)="guardar()" novalidate><div class="row"><div class="col-md-6"><label for="nombre" class="form-label">Nombres</label><input id="nombre" type="text" class="form-control" formControlName="nombre" maxlength="50" autocomplete="given-name" [attr.aria-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid" aria-describedby="nombre-error"><app-field-error id="nombre-error" [control]="form.controls.nombre"/><label for="dni" class="form-label">DNI (8 dígitos)</label><input id="dni" type="text" class="form-control" formControlName="dni" inputmode="numeric" maxlength="8" [attr.aria-invalid]="form.controls.dni.touched && form.controls.dni.invalid" aria-describedby="dni-error"><app-field-error id="dni-error" [control]="form.controls.dni"/><label for="email" class="form-label">Correo electrónico</label><input id="email" type="email" class="form-control" formControlName="email" autocomplete="email" maxlength="150" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="email-error"><app-field-error id="email-error" [control]="form.controls.email"/></div><div class="col-md-6"><label for="apellido" class="form-label">Apellidos</label><input id="apellido" type="text" class="form-control" formControlName="apellido" maxlength="50" autocomplete="family-name" [attr.aria-invalid]="form.controls.apellido.touched && form.controls.apellido.invalid" aria-describedby="apellido-error"><app-field-error id="apellido-error" [control]="form.controls.apellido"/><label for="telefono" class="form-label">Celular (9 dígitos)</label><input id="telefono" type="tel" class="form-control" formControlName="telefono" autocomplete="tel" maxlength="9" [attr.aria-invalid]="form.controls.telefono.touched && form.controls.telefono.invalid" aria-describedby="telefono-error"><app-field-error id="telefono-error" [control]="form.controls.telefono"/></div></div>
<label class="form-label" for="doctorId">Doctor de preferencia</label><select id="doctorId" class="form-select" formControlName="doctorId"><option [ngValue]="null">Sin preferencia</option>@for(d of doctores();track d.id){<option [ngValue]="d.id">{{d.nombre}} · {{d.especialidad}}</option>}</select><app-field-error [control]="form.controls.doctorId"/>
<label class="form-label" for="tratamientoId">Tratamiento</label><select id="tratamientoId" class="form-select" formControlName="tratamientoId"><option [ngValue]="null">Evaluación general</option>@for(t of tratamientos();track t.id){<option [ngValue]="t.id">{{t.nombre}}</option>}</select><app-field-error [control]="form.controls.tratamientoId"/>
<div class="row"><div class="col-md-6"><label for="fecha" class="form-label">Fecha</label><input id="fecha" type="date" class="form-control" formControlName="fecha" [min]="hoy" [attr.aria-invalid]="form.controls.fecha.touched && form.controls.fecha.invalid" aria-describedby="fecha-error"><app-field-error id="fecha-error" [control]="form.controls.fecha"/></div><div class="col-md-6"><label class="form-label" for="hora">Hora</label><select id="hora" class="form-select" formControlName="hora"><option value="">Selecciona una hora</option>@for(h of horas();track h){<option [value]="h">{{h}}</option>}</select><app-field-error [control]="form.controls.hora"/></div></div><label for="motivo" class="form-label">Motivo de la visita</label><input id="motivo" type="text" class="form-control" formControlName="motivo" maxlength="150" [attr.aria-invalid]="form.controls.motivo.touched && form.controls.motivo.invalid" aria-describedby="motivo-error"><app-field-error id="motivo-error" [control]="form.controls.motivo"/><label class="form-label" for="notas">Comentarios adicionales (opcional)</label><textarea id="notas" class="form-control" rows="3" formControlName="notas" maxlength="1000"></textarea><app-field-error [control]="form.controls.notas"/>
<button class="btn btn-brand mt-4" type="submit" [disabled]="enviando()">{{enviando() ? 'Enviando…' : 'Solicitar cita'}}</button></form></div>
