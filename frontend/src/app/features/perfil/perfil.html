<section class="container auth-page"><div class="form-card"><h1 class="h3">Mi perfil</h1>@if(error()) { <div class="alert alert-danger" role="alert">{{error()}}</div> }@if(exito()) { <div class="alert alert-success" role="status">{{exito()}}</div> }<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>@if(cargando()){<p role="status">Cargando perfil…</p>}<label for="nombre" class="form-label">Nombres</label><input id="nombre" type="text" class="form-control" formControlName="nombre" maxlength="50" autocomplete="given-name" [attr.aria-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid" aria-describedby="nombre-error"><app-field-error id="nombre-error" [control]="form.controls.nombre"/><label for="apellido" class="form-label">Apellidos</label><input id="apellido" type="text" class="form-control" formControlName="apellido" maxlength="50" autocomplete="family-name" [attr.aria-invalid]="form.controls.apellido.touched && form.controls.apellido.invalid" aria-describedby="apellido-error"><app-field-error id="apellido-error" [control]="form.controls.apellido"/><label for="email" class="form-label">Correo electrónico</label><input id="email" type="email" class="form-control" formControlName="email" maxlength="150" autocomplete="email" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="email-error"><app-field-error id="email-error" [control]="form.controls.email"/><label for="telefono" class="form-label">Celular</label><input id="telefono" type="tel" class="form-control" formControlName="telefono" maxlength="9" autocomplete="tel" [attr.aria-invalid]="form.controls.telefono.touched && form.controls.telefono.invalid" aria-describedby="telefono-error"><app-field-error id="telefono-error" [control]="form.controls.telefono"/><p class="small mt-3">Si cambias tu correo, deberás ingresar nuevamente.</p><button class="btn btn-brand mt-4 w-100" type="submit" [disabled]="enviando() || cargando() || form.disabled">{{enviando() ? 'Procesando…' : 'Guardar cambios'}}</button></form></div></section>
