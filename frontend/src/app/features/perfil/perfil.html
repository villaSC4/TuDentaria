<header>
  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
      <a routerLink="/" class="navbar-brand">
        <img src="/img/logo.png" alt="TuDentaria" height="70" />
      </a>
      <a routerLink="/" class="btn btn-outline-dark btn-sm fw-bold rounded-1">
        <i class="fas fa-arrow-left me-1"></i> Volver al Inicio
      </a>
    </div>
  </nav>
</header>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      @if (cargando()) {
        <p role="status" class="small text-muted">Cargando perfil…</p>
      }
      @if (exito()) {
        <div
          class="alert alert-success border-0 shadow-sm d-flex align-items-center mb-4 p-3 rounded-3"
          role="status"
          style="background-color: #def7ec; color: #03543f"
        >
          <i class="fas fa-check-circle fa-lg me-2"></i>
          <div class="fw-semibold small">{{ exito() }}</div>
        </div>
      }
      @if (error()) {
        <div
          class="alert alert-danger border-0 shadow-sm d-flex align-items-center mb-4 p-3 rounded-3"
          role="alert"
          style="background-color: #fde8e8; color: #e02424"
        >
          <i class="fas fa-exclamation-circle fa-lg me-2"></i>
          <div class="fw-semibold small">{{ error() }}</div>
        </div>
      }
      <div
        class="card border-0 bg-white shadow-sm p-4 md-p-5"
        style="border-radius: 16px"
      >
        <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
          <div
            class="bg-light d-flex align-items-center justify-content-center rounded-circle text-info border border-info border-2"
            style="width: 70px; height: 70px"
          >
            <i class="fas fa-user-circle fa-3x"></i>
          </div>
          <div class="ms-3">
            <h4 class="fw-bold m-0" style="color: #1f4b61">
              {{ auth.usuario()?.nombre }} {{ auth.usuario()?.apellido }}
            </h4>
            <span
              class="badge bg-light text-secondary border mt-1 px-2.5 py-1 text-uppercase fw-bold tracking-wider"
              style="font-size: 0.7rem"
              >Paciente Clínico</span
            >
          </div>
        </div>

        <h5
          class="fw-bold mb-3 text-uppercase small tracking-wide text-secondary"
        >
          <i class="fas fa-user-edit me-2"></i>Editar Datos Personales
        </h5>

        <form
          [formGroup]="form"
          (ngSubmit)="guardar()"
          novalidate
          method="POST"
        >
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label
                for="nombre"
                class="form-label small fw-semibold text-muted"
                >Nombre</label
              >
              <input
                type="text"
                id="nombre"
                formControlName="nombre"
                class="form-control bg-light rounded-2 py-2"
                required
                style="font-size: 0.9rem"
              />
              <app-field-error [control]="form.controls.nombre" />
            </div>
            <div class="col-md-6">
              <label
                for="apellido"
                class="form-label small fw-semibold text-muted"
                >Apellido</label
              >
              <input
                type="text"
                id="apellido"
                formControlName="apellido"
                class="form-control bg-light rounded-2 py-2"
                required
                style="font-size: 0.9rem"
              />
              <app-field-error [control]="form.controls.apellido" />
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="email" class="form-label small fw-semibold text-muted"
                >Correo Electrónico</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"
                  ><i class="far fa-envelope"></i
                ></span>
                <input
                  type="email"
                  id="email"
                  formControlName="email"
                  class="form-control bg-light border-start-0 rounded-end-2 py-2"
                  required
                  style="font-size: 0.9rem"
                />
              </div>
              <app-field-error [control]="form.controls.email" />
              <div class="form-text small text-muted">
                Si cambias tu correo, deberás volver a iniciar sesión.
              </div>
            </div>

            <div class="col-md-6">
              <label
                for="telefono"
                class="form-label small fw-semibold text-muted"
                >Teléfono Celular (9 dígitos)</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"
                  ><i class="fas fa-phone"></i
                ></span>
                <input
                  type="tel"
                  id="telefono"
                  formControlName="telefono"
                  maxlength="9"
                  pattern="^$|\d&#123;9&#125;"
                  class="form-control bg-light border-start-0 rounded-end-2 py-2"
                  placeholder="987654321"
                  style="font-size: 0.9rem"
                />
              </div>
              <app-field-error [control]="form.controls.telefono" />
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 border-top pt-4">
            <a
              routerLink="/"
              class="btn btn-light px-4 py-2 fw-semibold rounded-2"
              style="font-size: 0.9rem"
              >Cancelar</a
            >
            <button
              type="submit"
              [disabled]="enviando() || cargando() || form.disabled"
              class="btn text-white px-4 py-2 fw-bold rounded-2 shadow-sm"
              style="
                background-color: #00bcd4;
                border-color: #00bcd4;
                font-size: 0.9rem;
              "
            >
              <i class="fas fa-save me-1"></i> Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
