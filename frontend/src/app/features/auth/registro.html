<section class="container auth-page"><div class="form-card"><h1 class="h3">Crea tu cuenta</h1>@if(error()) { <div class="alert alert-danger" role="alert">{{error()}}</div> }@if(exito()) { <div class="alert alert-success" role="status">{{exito()}}</div> }<form [formGroup]="form" (ngSubmit)="guardar()" novalidate><label for="nombre" class="form-label">Nombres</label><input id="nombre" type="text" class="form-control" formControlName="nombre" autocomplete="given-name" maxlength="50" [attr.aria-invalid]="form.controls.nombre.touched && form.controls.nombre.invalid" aria-describedby="nombre-error"><app-field-error id="nombre-error" [control]="form.controls.nombre"/><label for="apellido" class="form-label">Apellidos</label><input id="apellido" type="text" class="form-control" formControlName="apellido" autocomplete="family-name" maxlength="50" [attr.aria-invalid]="form.controls.apellido.touched && form.controls.apellido.invalid" aria-describedby="apellido-error"><app-field-error id="apellido-error" [control]="form.controls.apellido"/><label for="dni" class="form-label">DNI (8 dígitos)</label><input id="dni" type="text" class="form-control" formControlName="dni" inputmode="numeric" maxlength="8" [attr.aria-invalid]="form.controls.dni.touched && form.controls.dni.invalid" aria-describedby="dni-error"><app-field-error id="dni-error" [control]="form.controls.dni"/><label for="telefono" class="form-label">Celular (9 dígitos)</label><input id="telefono" type="tel" class="form-control" formControlName="telefono" autocomplete="tel" maxlength="9" [attr.aria-invalid]="form.controls.telefono.touched && form.controls.telefono.invalid" aria-describedby="telefono-error"><app-field-error id="telefono-error" [control]="form.controls.telefono"/><label for="email" class="form-label">Correo electrónico</label><input id="email" type="email" class="form-control" formControlName="email" autocomplete="email" maxlength="150" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="email-error"><app-field-error id="email-error" [control]="form.controls.email"/><label for="password" class="form-label">Contraseña (mínimo 6 caracteres)</label><input id="password" type="password" class="form-control" formControlName="password" autocomplete="new-password" maxlength="72" [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" aria-describedby="password-error"><app-field-error id="password-error" [control]="form.controls.password"/><label for="confirmarPassword" class="form-label">Confirma tu contraseña</label><input id="confirmarPassword" type="password" class="form-control" formControlName="confirmarPassword" autocomplete="new-password" maxlength="72" [attr.aria-invalid]="form.controls.confirmarPassword.touched && form.controls.confirmarPassword.invalid" aria-describedby="confirmarPassword-error"><app-field-error id="confirmarPassword-error" [control]="form.controls.confirmarPassword"/>@if(form.hasError('noCoincide') && form.controls.confirmarPassword.touched){<p class="field-error" role="alert">Las contraseñas no coinciden.</p>}<button class="btn btn-brand mt-4 w-100" type="submit" [disabled]="enviando()">{{enviando() ? 'Procesando…' : 'Registrarme'}}</button></form></div></section>
