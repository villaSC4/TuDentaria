<section class="container auth-page"><div class="form-card"><h1 class="h3">Ingresa a TuDentaria</h1>@if(error()) { <div class="alert alert-danger" role="alert">{{error()}}</div> }@if(exito()) { <div class="alert alert-success" role="status">{{exito()}}</div> }<form [formGroup]="form" (ngSubmit)="guardar()" novalidate><label for="email" class="form-label">Correo electrónico</label><input id="email" type="email" class="form-control" formControlName="email" autocomplete="username" maxlength="150" [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" aria-describedby="email-error"><app-field-error id="email-error" [control]="form.controls.email"/><label for="password" class="form-label">Contraseña</label><input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password" maxlength="72" [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" aria-describedby="password-error"><app-field-error id="password-error" [control]="form.controls.password"/><button class="btn btn-brand mt-4 w-100" type="submit" [disabled]="enviando()">{{enviando() ? 'Procesando…' : 'Ingresar'}}</button></form></div></section><p class="container text-center">¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
