<h2>Usuarios</h2>@if(error()){<div class="alert alert-danger" role="alert">{{error()}}</div>}@if(exito()){<div class="alert alert-success" role="status">{{exito()}}</div>}@if(cargando()){<p role="status">Cargando datos…</p>}<div class="row g-4"><div class="col-lg-5"><form class="form-card" [formGroup]="form" (ngSubmit)="guardar()" novalidate><h3 class="h5">{{editing() ? 'Editar usuario' : 'Nuevo usuario'}}</h3><label class="form-label" for="nombre">Nombres</label><input id="nombre" class="form-control" type="text" formControlName="nombre" maxlength="50"><app-field-error [control]="form.controls.nombre"/><label class="form-label" for="apellido">Apellidos</label><input id="apellido" class="form-control" type="text" formControlName="apellido" maxlength="50"><app-field-error [control]="form.controls.apellido"/><label class="form-label" for="email">Correo electrónico</label><input id="email" class="form-control" type="email" formControlName="email" maxlength="150" autocomplete="off"><app-field-error [control]="form.controls.email"/><label class="form-label" for="password">Contraseña (vacía al editar: conservar)</label><input id="password" class="form-control" type="password" formControlName="password" maxlength="72" autocomplete="new-password"><app-field-error [control]="form.controls.password"/><label class="form-label" for="idRol">Rol</label><select id="idRol" class="form-select" formControlName="idRol"><option [ngValue]="null">Selecciona un rol</option>@for(r of roles();track r.id){<option [ngValue]="r.id">{{r.nombre}}</option>}</select><app-field-error [control]="form.controls.idRol"/><div class="d-flex gap-2 mt-4"><button type="submit" class="btn btn-brand" [disabled]="enviando()">{{enviando() ? 'Guardando…' : editing() ? 'Guardar cambios' : 'Crear'}}</button><button class="btn btn-outline-secondary" type="button" (click)="cancelar()">Limpiar</button></div></form></div><div class="col-lg-7"><div class="table-responsive"><table class="table"><thead><tr><th>Usuario</th><th>Rol</th><th>Acciones</th></tr></thead><tbody>@for(u of items();track u.id){<tr><td>{{u.nombre}} {{u.apellido}}<br><small>{{u.email}}</small></td><td>{{u.roles.join(', ')}}</td><td><button class="btn btn-sm btn-outline-dark me-2" (click)="editar(u)">Editar</button><button class="btn btn-sm btn-outline-danger" [disabled]="enviando() || u.id===auth.usuario()?.id" (click)="eliminar(u)">Eliminar</button></td></tr>}@empty{<tr><td colspan="3">No hay usuarios.</td></tr>}</tbody></table></div></div></div>
