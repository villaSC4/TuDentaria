<div
  class="sidebar-backdrop"
  [class.show]="menu()"
  (click)="menu.set(false)"
></div>
<aside class="sidebar" [class.show]="menu()">
  <div class="sidebar-brand">
    <a routerLink="/admin" (click)="menu.set(false)">
      <img src="/img/logo.png" alt="Tu Dentaria Logo" />
    </a>
    <button
      class="sidebar-close-btn d-lg-none"
      id="sidebarClose"
      (click)="menu.set(false)"
      aria-label="Cerrar menú"
    >
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="sidebar-content">
    <ul class="sidebar-menu">
      <li
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <a routerLink="/admin" (click)="menu.set(false)"
          ><i class="fas fa-chart-pie"></i> Dashboard</a
        >
      </li>

      <li class="menu-header">Atención Clínica</li>
      <li
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <a routerLink="/admin/citas" (click)="menu.set(false)"
          ><i class="fas fa-calendar-check"></i> Gestión de Citas</a
        >
      </li>

      <li class="menu-header">Personal Médico</li>
      <li
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <a routerLink="/admin/doctores" (click)="menu.set(false)"
          ><i class="fas fa-user-md"></i> Doctores</a
        >
      </li>

      <li class="menu-item" routerLinkActive="active">
        <a routerLink="/admin/tratamientos" (click)="menu.set(false)"
          ><i class="fas fa-tooth"></i> Tratamientos</a
        >
      </li>
      <li class="menu-header">Seguridad & Accesos</li>
      <li
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <a routerLink="/admin/usuarios" (click)="menu.set(false)"
          ><i class="fas fa-users-cog"></i> Cuentas de Usuario</a
        >
      </li>

      <li class="menu-header">Sitio Web</li>
      <li
        class="menu-item"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <a routerLink="/" (click)="menu.set(false)"
          ><i class="fas fa-external-link-alt"></i> Volver al Portal</a
        >
      </li>
    </ul>
  </div>

  <div class="sidebar-footer">
    <div class="d-flex align-items-center justify-content-between">
      <div class="small text-muted">v1.2 Clínico</div>
      <span class="badge bg-success-subtle text-success small fw-semibold"
        >Online</span
      >
    </div>
  </div>
</aside>
<div class="main-content">
  <header class="top-bar">
    <div class="top-bar-left">
      <button
        class="sidebar-toggle-btn d-lg-none"
        id="sidebarToggle"
        (click)="menu.set(!menu())"
        [attr.aria-expanded]="menu()"
        aria-label="Abrir menú"
      >
        <i class="fas fa-bars"></i>
      </button>
      <h5 class="top-bar-title m-0">{{ titulo() }}</h5>
    </div>

    <div class="top-bar-right">
      <div class="user-badge">
        <div class="user-avatar">
          <i class="fas fa-user-shield"></i>
        </div>
        <span class="user-name">{{ nombre() }}</span>
      </div>

      <button
        type="button"
        (click)="auth.salir()"
        class="btn btn-outline-danger btn-logout"
      >
        <i class="fas fa-sign-out-alt"></i>
        <span>Salir</span>
      </button>
    </div>
  </header>
  <router-outlet />
</div>
