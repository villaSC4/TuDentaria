<h2>Tratamientos</h2>@if(error()){<div class="alert alert-danger" role="alert">{{error()}}</div>}@if(exito()){<div class="alert alert-success" role="status">{{exito()}}</div>}@if(cargando()){<p role="status">Cargando datos…</p>}<div class="row g-4"><div class="col-lg-5"><form class="form-card" [formGroup]="form" (ngSubmit)="guardar()" novalidate><h3 class="h5">{{editing() ? 'Editar tratamiento' : 'Nuevo tratamiento'}}</h3><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" type="text" formControlName="nombre" maxlength="100"><app-field-error [control]="form.controls.nombre"/><label class="form-label" for="descripcion">Descripción</label><input id="descripcion" class="form-control" type="text" formControlName="descripcion" maxlength="255"><app-field-error [control]="form.controls.descripcion"/><label class="form-label" for="precio">Precio (S/)</label><input id="precio" class="form-control" type="number" formControlName="precio" min="0.01" step="0.01"><app-field-error [control]="form.controls.precio"/><label class="form-label" for="duracionMinutos">Duración en minutos</label><input id="duracionMinutos" class="form-control" type="number" formControlName="duracionMinutos" min="1" step="1"><app-field-error [control]="form.controls.duracionMinutos"/><div class="d-flex gap-2 mt-4"><button type="submit" class="btn btn-brand" [disabled]="enviando()">{{enviando() ? 'Guardando…' : editing() ? 'Guardar cambios' : 'Crear'}}</button><button class="btn btn-outline-secondary" type="button" (click)="cancelar()">Limpiar</button></div></form></div><div class="col-lg-7"><div class="table-responsive"><table class="table"><thead><tr><th>Tratamiento</th><th>Precio</th><th>Acciones</th></tr></thead><tbody>@for(t of items();track t.id){<tr><td>{{t.nombre}}</td><td>{{t.precio|currency:'PEN':'S/ '}}</td><td><button class="btn btn-sm btn-outline-dark me-2" (click)="editar(t)">Editar</button><button class="btn btn-sm btn-outline-danger" [disabled]="enviando()" (click)="eliminar(t)">Eliminar</button></td></tr>}@empty{<tr><td colspan="3">No hay tratamientos.</td></tr>}</tbody></table></div></div></div>
