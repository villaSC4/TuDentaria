<h2>Doctores</h2>@if(error()){<div class="alert alert-danger" role="alert">{{error()}}</div>}@if(exito()){<div class="alert alert-success" role="status">{{exito()}}</div>}@if(cargando()){<p role="status">Cargando datos…</p>}<div class="row g-4"><div class="col-lg-5"><form class="form-card" [formGroup]="form" (ngSubmit)="guardar()" novalidate><h3 class="h5">{{editing() ? 'Editar doctor' : 'Nuevo doctor'}}</h3><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" type="text" formControlName="nombre" maxlength="100"><app-field-error [control]="form.controls.nombre"/><label class="form-label" for="especialidadId">Especialidad</label><select id="especialidadId" class="form-select" formControlName="especialidadId"><option [ngValue]="null">Selecciona una especialidad</option>@for(e of especialidades();track e.id){<option [ngValue]="e.id">{{e.nombre}}</option>}</select><app-field-error [control]="form.controls.especialidadId"/>
<label class="form-label" for="foto">Fotografía (opcional)</label><input id="foto" #foto type="file" class="form-control" accept="image/png,image/jpeg,image/webp" (change)="archivo($event)" [disabled]="enviando()"><p class="small mt-2">JPG, PNG o WEBP; máximo 5 MB.</p><app-field-error [control]="form.controls.foto"/><div class="d-flex gap-2 mt-4"><button type="submit" class="btn btn-brand" [disabled]="enviando()">{{enviando() ? 'Guardando…' : editing() ? 'Guardar cambios' : 'Crear'}}</button><button class="btn btn-outline-secondary" type="button" (click)="cancelar()">Limpiar</button></div></form></div><div class="col-lg-7"><div class="table-responsive"><table class="table"><thead><tr><th>Doctor</th><th>Especialidad</th><th>Acciones</th></tr></thead><tbody>@for(d of items();track d.id){<tr><td>{{d.nombre}}</td><td>{{d.especialidad}}</td><td><button class="btn btn-sm btn-outline-dark me-2" (click)="editar(d)">Editar</button><button class="btn btn-sm btn-outline-danger" [disabled]="enviando()" (click)="eliminar(d)">Eliminar</button></td></tr>}@empty{<tr><td colspan="3">No hay doctores.</td></tr>}</tbody></table></div></div></div>
